services:
  deckbuilder:
    build: .
    container_name: deckbuilder
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    # .env provides DECKBUILDER_PORT, DATABASE_URL, JWT_SECRET, ADMIN_*, HTTP_USER_AGENT.
    # See .env.example. On the server it lives at /root/stacks/deckbuilder/.env.
